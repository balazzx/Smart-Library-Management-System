{% extends "base.html" %}

{% block title %}Student Registration - Smart Library System{% endblock %}

{% block content %}
<div class="row justify-content-center mt-4">
    <div class="col-md-7 col-lg-6">
        <div class="card card-custom p-4 shadow-lg border-0 rounded-4">
            <h4 class="fw-bold text-navy mb-1"><i class="fa-solid fa-user-plus text-primary me-2"></i>Student Registration</h4>
            <p class="text-muted small mb-4">Create your smart library digital card account</p>

            <form method="POST" action="{{ url_for('auth.register') }}">
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label font-monospace fs-7 text-uppercase fw-bold text-muted">Full Name</label>
                        <input type="text" name="name" class="form-control" placeholder="John Doe" required>
                    </div>

                    <div class="col-md-6 mb-3">
                        <label class="form-label font-monospace fs-7 text-uppercase fw-bold text-muted">Student Roll ID</label>
                        <input type="text" name="student_id" class="form-control" placeholder="21CSE099" required>
                    </div>
                </div>

                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label font-monospace fs-7 text-uppercase fw-bold text-muted">Username</label>
                        <input type="text" name="username" class="form-control" placeholder="johndoe" required>
                    </div>

                    <div class="col-md-6 mb-3">
                        <label class="form-label font-monospace fs-7 text-uppercase fw-bold text-muted">College Email</label>
                        <input type="email" name="email" class="form-control" placeholder="john.doe@college.edu" required>
                    </div>
                </div>

                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label font-monospace fs-7 text-uppercase fw-bold text-muted">Department</label>
                        <select name="department_id" class="form-select" required>
                            <option value="" disabled selected>Select Department...</option>
                            {% for dept in departments %}
                                <option value="{{ dept.id }}">{{ dept.code }} - {{ dept.name }}</option>
                            {% endfor %}
                        </select>
                    </div>

                    <div class="col-md-6 mb-3">
                        <label class="form-label font-monospace fs-7 text-uppercase fw-bold text-muted">Phone Number</label>
                        <input type="text" name="phone" class="form-control" placeholder="9876543210">
                    </div>
                </div>

                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label font-monospace fs-7 text-uppercase fw-bold text-muted">Password</label>
                        <input type="password" name="password" class="form-control" placeholder="••••••••" required>
                    </div>

                    <div class="col-md-6 mb-3">
                        <label class="form-label font-monospace fs-7 text-uppercase fw-bold text-muted">Confirm Password</label>
                        <input type="password" name="confirm_password" class="form-control" placeholder="••••••••" required>
                    </div>
                </div>

                <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold mt-2 rounded-3">
                    <i class="fa-solid fa-address-card me-2"></i> Register Account
                </button>
            </form>

            <div class="text-center mt-3 pt-3 border-top">
                <p class="text-muted small mb-0">Already registered? <a href="{{ url_for('auth.login') }}" class="text-primary fw-semibold text-decoration-none">Log In Here</a></p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
