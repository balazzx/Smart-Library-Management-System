{% extends "base.html" %}

{% block title %}Reset Password - KIOT Central Library{% endblock %}

{% block content %}
<div class="row justify-content-center align-items-center mt-4">
    <div class="col-md-5 col-lg-4">
        <div class="card card-custom p-4 shadow-lg border-0 rounded-4">
            <div class="text-center mb-4">
                <img src="{{ url_for('static', filename='uploads/kiot_logo.jpg') }}" alt="KIOT Logo" class="mb-3" style="max-height: 70px; object-fit: contain;">
                <h4 class="fw-bold text-navy mb-1">KIOT Central Library</h4>
                <p class="text-muted small">Set New Account Password</p>
            </div>

            <form method="POST" action="{{ url_for('auth.reset_password', token=token) }}">
                <div class="mb-3">
                    <label class="form-label font-monospace fs-7 text-uppercase fw-bold text-muted">New Password</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light text-muted"><i class="fa-solid fa-lock"></i></span>
                        <input type="password" id="newPasswordInput" name="new_password" class="form-control" placeholder="••••••••" required>
                        <button type="button" class="btn btn-outline-secondary" onclick="togglePasswordVisibility('newPasswordInput', 'newEyeIcon')">
                            <i id="newEyeIcon" class="fa-solid fa-eye"></i>
                        </button>
                    </div>
                </div>

                <div class="mb-4">
                    <label class="form-label font-monospace fs-7 text-uppercase fw-bold text-muted">Confirm New Password</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light text-muted"><i class="fa-solid fa-lock"></i></span>
                        <input type="password" id="confirmPasswordInput" name="confirm_password" class="form-control" placeholder="••••••••" required>
                        <button type="button" class="btn btn-outline-secondary" onclick="togglePasswordVisibility('confirmPasswordInput', 'confirmEyeIcon')">
                            <i id="confirmEyeIcon" class="fa-solid fa-eye"></i>
                        </button>
                    </div>
                </div>

                <button type="submit" class="btn btn-success text-white w-100 py-2 fw-semibold rounded-3 mb-3"><i class="fa-solid fa-check-circle me-2"></i>Update Password</button>
            </form>

            <div class="text-center mt-3 pt-3 border-top">
                <a href="{{ url_for('auth.login') }}" class="text-decoration-none small text-navy fw-semibold"><i class="fa-solid fa-arrow-left me-1"></i>Back to Login</a>
            </div>
        </div>
    </div>
</div>

<script>
function togglePasswordVisibility(inputId, iconId) {
    const inp = document.getElementById(inputId);
    const icon = document.getElementById(iconId);
    if (inp && icon) {
        if (inp.type === 'password') {
            inp.type = 'text';
            icon.classList.remove('fa-eye');
            icon.classList.add('fa-eye-slash');
        } else {
            inp.type = 'password';
            icon.classList.remove('fa-eye-slash');
            icon.classList.add('fa-eye');
        }
    }
}
</script>
{% endblock %}
