{% extends "base.html" %}

{% block title %}Forgot Password - KIOT Central Library{% endblock %}

{% block content %}
<div class="row justify-content-center align-items-center mt-4">
    <div class="col-md-5 col-lg-4">
        <div class="card card-custom p-4 shadow-lg border-0 rounded-4">
            <div class="text-center mb-4">
                <img src="{{ url_for('static', filename='uploads/kiot_logo.jpg') }}" alt="KIOT Logo" class="mb-3" style="max-height: 70px; object-fit: contain;">
                <h4 class="fw-bold text-navy mb-1">KIOT Central Library</h4>
                <p class="text-muted small">Account Password Recovery</p>
            </div>

            <form method="POST" action="{{ url_for('auth.forgot_password') }}">
                <div class="mb-3">
                    <label class="form-label font-monospace fs-7 text-uppercase fw-bold text-muted">Registered Email or Roll No / Username</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light text-muted"><i class="fa-solid fa-envelope"></i></span>
                        <input type="text" name="email" class="form-control" placeholder="e.g. 2k24cse003@kiot.ac.in" required autofocus>
                    </div>
                </div>

                <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold rounded-3 mb-3"><i class="fa-solid fa-paper-plane me-2"></i>Send Reset Link</button>
            </form>

            <div class="text-center mt-3 pt-3 border-top">
                <a href="{{ url_for('auth.login') }}" class="text-decoration-none small text-navy fw-semibold"><i class="fa-solid fa-arrow-left me-1"></i>Back to Login</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
