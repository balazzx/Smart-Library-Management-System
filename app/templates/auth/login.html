{% extends "base.html" %}

{% block title %}Login - KIOT Central Library{% endblock %}

{% block content %}
<div class="row justify-content-center align-items-center mt-4">
    <div class="col-md-5 col-lg-4">
        <div class="card card-custom p-4 shadow-lg border-0 rounded-4">
            <div class="text-center mb-4">
                <img src="{{ url_for('static', filename='uploads/kiot_logo.jpg') }}" alt="KIOT Logo" class="mb-3" style="max-height: 70px; object-fit: contain;">
                <h4 class="fw-bold text-navy mb-1">KIOT Central Library</h4>
                <p class="text-muted small">Knowledge Institute of Technology Portal</p>
            </div>

            <form method="POST" action="{{ url_for('auth.login') }}">
                <div class="mb-3">
                    <label class="form-label font-monospace fs-7 text-uppercase fw-bold text-muted">Roll No / Username / Email</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light text-muted"><i class="fa-solid fa-user"></i></span>
                        <input type="text" name="login_input" class="form-control" placeholder="Enter your Roll Number or Username" required autofocus>
                    </div>
                </div>

                <div class="mb-3">
                    <div class="d-flex justify-content-between align-items-center">
                        <label class="form-label font-monospace fs-7 text-uppercase fw-bold text-muted mb-1">Password</label>
                        <a href="{{ url_for('auth.forgot_password') }}" class="small text-primary text-decoration-none fw-semibold">Forgot Password?</a>
                    </div>
                    <div class="input-group">
                        <span class="input-group-text bg-light text-muted"><i class="fa-solid fa-lock"></i></span>
                        <input type="password" id="loginPasswordInput" name="password" class="form-control" placeholder="••••••••" required>
                        <button type="button" class="btn btn-outline-secondary" onclick="togglePasswordVisibility('loginPasswordInput', 'loginEyeIcon')">
                            <i id="loginEyeIcon" class="fa-solid fa-eye"></i>
                        </button>
                    </div>
                </div>

                <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold mb-3 rounded-3">
                    <i class="fa-solid fa-right-to-bracket me-2"></i> Log In
                </button>
            </form>
        </div>
    </div>
</div>

<script>
function togglePasswordVisibility(inputId, iconId) {
    const inp = document.getElementById(inputId);
    const icon = document.getElementById(iconId);
    if (inp && icon) {
        if (inp.type === 'password') {
            inp.type = 'text';
            icon.classList.remove('fa-eye');
            icon.classList.add('fa-eye-slash');
        } else {
            inp.type = 'password';
            icon.classList.remove('fa-eye-slash');
            icon.classList.add('fa-eye');
        }
    }
}
</script>
{% endblock %}
