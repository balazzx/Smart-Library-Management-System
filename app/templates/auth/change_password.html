{% extends "base.html" %}

{% block title %}Change Password - Smart Library System{% endblock %}

{% block content %}
<div class="row justify-content-center mt-4">
    <div class="col-md-5">
        <div class="card card-custom p-4 shadow-sm border-0 rounded-4">
            <h5 class="fw-bold mb-3"><i class="fa-solid fa-key text-warning me-2"></i>Change Password</h5>
            
            <form method="POST" action="{{ url_for('auth.change_password') }}">
                <div class="mb-3">
                    <label class="form-label font-monospace fs-7 text-uppercase fw-bold text-muted">Current Password</label>
                    <input type="password" name="current_password" class="form-control" required>
                </div>

                <div class="mb-3">
                    <label class="form-label font-monospace fs-7 text-uppercase fw-bold text-muted">New Password</label>
                    <input type="password" name="new_password" class="form-control" required>
                </div>

                <div class="mb-3">
                    <label class="form-label font-monospace fs-7 text-uppercase fw-bold text-muted">Confirm New Password</label>
                    <input type="password" name="confirm_password" class="form-control" required>
                </div>

                <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold rounded-3">Update Password</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
