{% extends "base.html" %}

{% block title %}Edit Book - Librarian Portal{% endblock %}

{% block content %}
<div class="container-fluid px-4 py-3">
    <div class="d-flex align-items-center justify-content-between mb-4">
        <div>
            <h4 class="fw-bold mb-1"><i class="fa-solid fa-pen-to-square text-primary me-2"></i>Edit Book Details</h4>
            <p class="text-muted small mb-0">Update metadata and shelf location for '{{ book.title }}'</p>
        </div>
        <a href="{{ url_for('librarian.books') }}" class="btn btn-outline-secondary btn-sm rounded-pill px-3">
            <i class="fa-solid fa-arrow-left me-1"></i> Back to Catalog
        </a>
    </div>

    <div class="card border-0 shadow-sm rounded-4">
        <div class="card-body p-4">
            <form action="{{ url_for('librarian.edit_book', book_id=book.id) }}" method="POST" enctype="multipart/form-data">
                <div class="row g-3">
                    <div class="col-md-8">
                        <label class="form-label fw-semibold small">Book Title <span class="text-danger">*</span></label>
                        <input type="text" name="title" class="form-control rounded-3" value="{{ book.title }}" required>
                    </div>

                    <div class="col-md-4">
                        <label class="form-label fw-semibold small">ISBN <span class="text-danger">*</span></label>
                        <input type="text" name="isbn" class="form-control rounded-3" value="{{ book.isbn }}" required>
                    </div>

                    <div class="col-md-4">
                        <label class="form-label fw-semibold small">Author <span class="text-danger">*</span></label>
                        <select name="author_id" class="form-select rounded-3" required>
                            {% for a in authors %}
                                <option value="{{ a.id }}" {% if a.id == book.author_id %}selected{% endif %}>{{ a.name }}</option>
                            {% endfor %}
                        </select>
                    </div>

                    <div class="col-md-4">
                        <label class="form-label fw-semibold small">Category <span class="text-danger">*</span></label>
                        <select name="category_id" class="form-select rounded-3" required>
                            {% for c in categories %}
                                <option value="{{ c.id }}" {% if c.id == book.category_id %}selected{% endif %}>{{ c.name }}</option>
                            {% endfor %}
                        </select>
                    </div>

                    <div class="col-md-4">
                        <label class="form-label fw-semibold small">Publisher <span class="text-danger">*</span></label>
                        <select name="publisher_id" class="form-select rounded-3" required>
                            {% for p in publishers %}
                                <option value="{{ p.id }}" {% if p.id == book.publisher_id %}selected{% endif %}>{{ p.name }}</option>
                            {% endfor %}
                        </select>
                    </div>

                    <div class="col-md-4">
                        <label class="form-label fw-semibold small">Publication Year</label>
                        <input type="number" name="pub_year" class="form-control rounded-3" value="{{ book.pub_year }}" required>
                    </div>

                    <div class="col-md-4">
                        <label class="form-label fw-semibold small">Language</label>
                        <input type="text" name="language" class="form-control rounded-3" value="{{ book.language }}">
                    </div>

                    <div class="col-md-4">
                        <label class="form-label fw-semibold small">Smart Shelf Location</label>
                        <select name="location_id" class="form-select rounded-3">
                            <option value="">-- Unassigned --</option>
                            {% for loc in locations %}
                                <option value="{{ loc.id }}" {% if loc.id == book.location_id %}selected{% endif %}>{{ loc.display_name }}</option>
                            {% endfor %}
                        </select>
                    </div>

                    <div class="col-12">
                        <label class="form-label fw-semibold small">Description</label>
                        <textarea name="description" class="form-control rounded-3" rows="4">{{ book.description or '' }}</textarea>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label fw-semibold small">Update Cover Image (Optional)</label>
                        <input type="file" name="cover_image" class="form-control rounded-3" accept="image/*">
                    </div>
                </div>

                <div class="mt-4 text-end">
                    <button type="submit" class="btn btn-primary rounded-pill px-4">
                        <i class="fa-solid fa-floppy-disk me-1"></i> Update Book
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
