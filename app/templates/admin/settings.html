{% extends "base.html" %}

{% block title %}System Settings - Smart Library{% endblock %}

{% block content %}
<div class="container-fluid">
    <div class="row justify-content-center">
        <div class="col-lg-8">
            <div class="card card-custom p-4 shadow-sm border-0 rounded-4">
                <h4 class="fw-bold text-navy mb-3"><i class="fa-solid fa-gears text-primary me-2"></i>Global System Configuration</h4>
                
                <form method="POST" action="{{ url_for('admin.settings') }}">
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label font-monospace fs-7 text-uppercase fw-bold text-muted">Library Display Name</label>
                            <input type="text" name="library_name" class="form-control" value="{{ settings.LIBRARY_NAME }}" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label font-monospace fs-7 text-uppercase fw-bold text-muted">Max Borrow Limit Per Student</label>
                            <input type="number" name="max_borrow_limit" class="form-control" value="{{ settings.MAX_BORROW_LIMIT }}" required>
                        </div>
                    </div>

                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label font-monospace fs-7 text-uppercase fw-bold text-muted">Standard Borrow Period (Days)</label>
                            <input type="number" name="borrow_period_days" class="form-control" value="{{ settings.BORROW_PERIOD_DAYS }}" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label font-monospace fs-7 text-uppercase fw-bold text-muted">Grace Period Before Fines (Days)</label>
                            <input type="number" name="grace_period_days" class="form-control" value="{{ settings.GRACE_PERIOD_DAYS }}" required>
                        </div>
                    </div>

                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label font-monospace fs-7 text-uppercase fw-bold text-muted">Fine Rate Per Day (₹)</label>
                            <input type="number" step="0.5" name="fine_per_day" class="form-control" value="{{ settings.FINE_PER_DAY }}" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label font-monospace fs-7 text-uppercase fw-bold text-muted">Max Fine Cap (₹)</label>
                            <input type="number" step="10" name="max_fine" class="form-control" value="{{ settings.MAX_FINE }}" required>
                        </div>
                    </div>

                    <div class="mb-4">
                        <label class="form-label font-monospace fs-7 text-uppercase fw-bold text-muted">Reservation Claim Period (Hours)</label>
                        <input type="number" name="claim_period_hours" class="form-control" value="{{ settings.CLAIM_PERIOD_HOURS }}" required>
                    </div>

                    <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold rounded-3"><i class="fa-solid fa-floppy-disk me-2"></i>Save Configuration Changes</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
